<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Underservedness Heatmap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ffffff;
    color: #222;
    padding: 32px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 6px;
    color: #111;
  }
  .subtitle {
    font-size: 13px;
    color: #666;
    margin-bottom: 52px;
    padding-bottom: 20px;
  }
  .heatmap-wrap {
    overflow-x: hidden;
    margin-top: 32px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 680px;
  }
  th {
    font-size: 12px;
    font-weight: 500;
    color: #555;
    padding: 8px 12px;
    text-align: center;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  th.script-col {
    text-align: left;
    min-width: 120px;
  }
  td.script-name {
    font-size: 14px;
    font-weight: 500;
    color: #222;
    padding: 6px 12px;
    white-space: nowrap;
  }
  td.cell {
    padding: 4px 6px;
    text-align: center;
    cursor: default;
    position: relative;
  }
  .cell-inner {
    border-radius: 6px;
    padding: 10px 8px;
    font-size: 12px;
    font-weight: 500;
    transition: transform 0.15s, box-shadow 0.15s;
    user-select: none;
  }
  .cell-inner:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    z-index: 10;
    position: relative;
  }
  .tooltip {
    display: none;
    position: fixed;
    background: #f5f5f5;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: #222;
    z-index: 1000;
    pointer-events: none;
    max-width: 200px;
  }
  .tooltip.show { display: block; }
  .tooltip-metric { font-weight: 600; margin-bottom: 4px; }
  .tooltip-raw { color: #666; }
  .legend {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    margin-top: 24px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #555;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }
  .tier-badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    margin-left: 8px;
    vertical-align: middle;
  }
  tr:hover td.script-name { color: #000; }
  .note {
    margin-top: 24px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>

<!-- <h1>Script Servedness Score (SSS)</h1> -->
<p class="subtitle">
  TRC / Sawyer Lab | All values normalized 0-1 | Sorted by SSS (best served first)
</p>

<div class="heatmap-wrap">
  <table id="heatmap">
    <thead>
      <tr>
        <th class="script-col">Script</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="legend" id="legend"></div>
<p class="note">Hover over any cell for the raw value. SSS = Script Servedness Score: combines all four indices.</p>

<div class="tooltip" id="tooltip"></div>

<script>
const data = [{"script": "Latin", "cells": [{"norm": 1.0, "raw": "0.775", "label": "SSS", "color": "#7F77DD"}, {"norm": 1.0, "raw": "20,191,468", "label": "Web Exposure", "color": "#3B8BD4"}, {"norm": 1.0, "raw": "1920", "label": "Font Support", "color": "#EF9F27"}, {"norm": 0.148, "raw": "0.148", "label": "Similarity", "color": "#1D9E75"}]}, {"script": "Telugu", "cells": [{"norm": 0.8046, "raw": "0.623", "label": "SSS", "color": "#7F77DD"}, {"norm": 0.0, "raw": "12,278", "label": "Web Exposure", "color": "#3B8BD4"}, {"norm": 0.1739, "raw": "27", "label": "Font Support", "color": "#EF9F27"}, {"norm": 0.6417, "raw": "0.642", "label": "Similarity", "color": "#1D9E75"}]}, {"script": "Katakana", "cells": [{"norm": 0.7768, "raw": "0.602", "label": "SSS", "color": "#7F77DD"}, {"norm": 0.4817, "raw": "434,832", "label": "Web Exposure", "color": "#3B8BD4"}, {"norm": 0.35, "raw": "67", "label": "Font Support", "color": "#EF9F27"}, {"norm": 0.0, "raw": "0.000", "label": "Similarity", "color": "#1D9E75"}]}, {"script": "Cyrillic", "cells": [{"norm": 0.6447, "raw": "0.499", "label": "SSS", "color": "#7F77DD"}, {"norm": 0.7244, "raw": "2,623,937", "label": "Web Exposure", "color": "#3B8BD4"}, {"norm": 0.6358, "raw": "293", "label": "Font Support", "color": "#EF9F27"}, {"norm": 0.3525, "raw": "0.353", "label": "Similarity", "color": "#1D9E75"}]}, {"script": "Han", "cells": [{"norm": 0.4261, "raw": "0.330", "label": "SSS", "color": "#7F77DD"}, {"norm": 0.2782, "raw": "96,340", "label": "Web Exposure", "color": "#3B8BD4"}, {"norm": 0.1666, "raw": "26", "label": "Font Support", "color": "#EF9F27"}, {"norm": 0.2509, "raw": "0.251", "label": "Similarity", "color": "#1D9E75"}]}, {"script": "Arabic", "cells": [{"norm": 0.3495, "raw": "0.271", "label": "SSS", "color": "#7F77DD"}, {"norm": 0.3339, "raw": "145,526", "label": "Web Exposure", "color": "#3B8BD4"}, {"norm": 0.3082, "raw": "54", "label": "Font Support", "color": "#EF9F27"}, {"norm": 0.6189, "raw": "0.619", "label": "Similarity", "color": "#1D9E75"}]}, {"script": "Devanagari", "cells": [{"norm": 0.1521, "raw": "0.118", "label": "SSS", "color": "#7F77DD"}, {"norm": 0.372, "raw": "192,989", "label": "Web Exposure", "color": "#3B8BD4"}, {"norm": 0.335, "raw": "62", "label": "Font Support", "color": "#EF9F27"}, {"norm": 0.834, "raw": "0.834", "label": "Similarity", "color": "#1D9E75"}]}, {"script": "Bengali", "cells": [{"norm": 0.0, "raw": "0.000", "label": "SSS", "color": "#7F77DD"}, {"norm": 0.0848, "raw": "23,006", "label": "Web Exposure", "color": "#3B8BD4"}, {"norm": 0.0, "raw": "11", "label": "Font Support", "color": "#EF9F27"}, {"norm": 0.8448, "raw": "0.845", "label": "Similarity", "color": "#1D9E75"}]}, {"script": "Tamil", "cells": [{"norm": 0.0, "raw": "0.000", "label": "SSS", "color": "#7F77DD"}, {"norm": 0.0334, "raw": "15,721", "label": "Web Exposure", "color": "#3B8BD4"}, {"norm": 0.0843, "raw": "17", "label": "Font Support", "color": "#EF9F27"}, {"norm": 1.0, "raw": "1.000", "label": "Similarity", "color": "#1D9E75"}]}];
const metrics = [{"label": "SSS", "desc": "Higher = well served", "color": "#7F77DD", "raw_label": "Raw SSS Value"}, {"label": "Web Exposure", "desc": "Higher = more readers", "color": "#3B8BD4", "raw_label": "Num Requests"}, {"label": "Font Support", "desc": "Higher = more fonts", "color": "#EF9F27", "raw_label": "Num Fonts"}, {"label": "Similarity", "desc": "Higher = less visual choice", "color": "#1D9E75", "raw_label": "Similarity Index"}];

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function cellColor(norm, hexColor) {
  const rgb = hexToRgb(hexColor);
  const alpha = 0.4 + norm * 0.6;
  return {
    bg: `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`,
    text: `rgba(31, 31, 31, 1)`,
  };
}

// Build header
const thead = document.querySelector('thead tr');
metrics.forEach(m => {
  const th = document.createElement('th');
  th.textContent = m.label;
  th.title = m.desc;
  thead.appendChild(th);
});

// Build rows
const tbody = document.getElementById('tbody');
data.forEach((row, ri) => {
  const tr = document.createElement('tr');

  // Script name cell with tier badge
  const tdName = document.createElement('td');
  tdName.className = 'script-name';
  const sssNorm = row.cells[0].norm;
  const tier = sssNorm > 0.6 ? ['Well served','#1D9E75','#E1F5EE'] :
               sssNorm > 0.3 ? ['Moderate','#EF9F27','#FAEEDA'] :
                               ['Underserved','#E24B4A','#FCEBEB'];
  tdName.innerHTML = `${row.script}<span class="tier-badge" style="background:${tier[2]};color:${tier[1]}">${tier[0]}</span>`;
  tr.appendChild(tdName);

  // Metric cells
  row.cells.forEach((cell, ci) => {
    const td = document.createElement('td');
    td.className = 'cell';
    const colors = cellColor(cell.norm, metrics[ci].color);
    const inner = document.createElement('div');
    inner.className = 'cell-inner';
    inner.style.background = colors.bg;
    inner.style.color = colors.text;
    inner.textContent = (cell.norm * 100).toFixed(0) + '%';

    // Tooltip
    inner.addEventListener('mousemove', (e) => {
      const tt = document.getElementById('tooltip');
      tt.innerHTML = `<div class="tooltip-metric" style="color:${metrics[ci].color}">${cell.label}</div>
        <div>Normalized: <strong>${(cell.norm*100).toFixed(1)}%</strong></div>
        <div class="tooltip-raw">${metrics[ci].raw_label}: ${cell.raw}</div>
        <div class="tooltip-raw" style="margin-top:4px;font-style:italic">${metrics[ci].desc}</div>`;
      tt.classList.add('show');
      tt.style.left = (e.clientX + 14) + 'px';
      tt.style.top = (e.clientY - 10) + 'px';
    });
    inner.addEventListener('mouseleave', () => {
      document.getElementById('tooltip').classList.remove('show');
    });

    td.appendChild(inner);
    tr.appendChild(td);
  });

  tbody.appendChild(tr);
});

// Legend
const legend = document.getElementById('legend');
metrics.forEach(m => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<div class="legend-dot" style="background:${m.color}"></div>${m.label}: ${m.desc}`;
  legend.appendChild(item);
});
</script>
</body>
</html>
