[project]
name = "thescriptgap"
version = "1.0.0"
description = "Identifying writing systems under-served by open-source digital typography (Script Servedness Score)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash[cloud]>=4.1.0",
    "db-dtypes>=1.7.0",
    "dotenv>=0.9.9",
    "fonttools>=4.62.0",
    "google-cloud-bigquery>=3.40.0",
    "google-cloud-bigquery-storage>=2.39.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "rapidfuzz>=3.14.5",
    "requests>=2.33.0",
    "scikit-learn>=1.8.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

